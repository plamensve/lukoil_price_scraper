name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "build_windows.bat"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.12,<7"

      - name: Run parser and export tests
        run: python -m unittest discover -s tests -v

      - name: Build standalone Windows application
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LukoilPriceScraper --collect-all playwright --collect-data customtkinter --hidden-import=PIL._tkinter_finder main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LukoilPriceScraper-Windows
          path: dist/LukoilPriceScraper.exe
          if-no-files-found: error
          retention-days: 30
